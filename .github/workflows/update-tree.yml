name: Update Project Structure

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  update-tree:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      # Generate tree for CarsAnalytics.ExperienceApi
      - name: Generate tree for CarsAnalytics.ExperienceApi
        run: |
          echo "## CarsAnalytics.ExperienceApi" > ProjectStructure.txt
          tree CarsAnalytics.ExperienceApi \
            -a \
            -I "bin|obj|Migrations|*.user|*.cache" \
            >> ProjectStructure.txt

      # Generate tree for CarsAnalytics.ExperienceApi.Tests
      - name: Generate tree for CarsAnalytics.ExperienceApi.Tests
        run: |
          echo "" >> ProjectStructure.txt
          echo "## CarsAnalytics.ExperienceApi.Tests" >> ProjectStructure.txt
          tree CarsAnalytics.ExperienceApi.Tests \
            -a \
            -I "bin|obj|*.user|*.cache" \
            >> ProjectStructure.txt

      # Commit changes to the SAME branch where workflow was triggered
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update project structure"
          file_pattern: ProjectStructure.txt
          branch: ${{ github.ref_name }}